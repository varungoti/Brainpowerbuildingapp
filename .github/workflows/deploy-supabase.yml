name: Deploy Supabase (DB + Edge Functions)

# Pushes migrations and deploys edge functions on every commit to main, or
# manually via the workflow_dispatch button. Required repo secrets:
#   SUPABASE_ACCESS_TOKEN — Supabase personal access token
#   SUPABASE_PROJECT_ID   — project ref (e.g. abcd1234)
#
# Functions auto-discovered: server, marketing-os, marketing-public,
# razorpay-webhook, social-publish-worker (anything under supabase/functions/).

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:
    inputs:
      skip_db_push:
        description: "Skip db push (only redeploy functions)"
        required: false
        default: "false"

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Pre-flight check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID not set in repo secrets. Skipping deploy."
            exit 78
          fi

      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push DB migrations
        if: ${{ github.event.inputs.skip_db_push != 'true' }}
        run: supabase db push --linked

      - name: Deploy edge functions
        run: |
          supabase functions deploy server --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy marketing-os --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy marketing-public --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy razorpay-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy social-publish-worker --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
